openapi: 3.0.3
info:
  title: commerce API
  version: 1.0.0
servers:
  - url: /api
tags:
  - name: Item
paths:
  /orders:
    get:
      tags: [commerce]
      summary: fetch orders
      description: >
        Fetch all the orders on the system
      operationId: listOrders
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
    post:
      tags: [commerce]
      summary: create an orderId
      description: >
        Create an order record based on the provided input
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Order"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
  /items:
    get:
      tags: [Item]
      operationId: listItems
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Item" }
    post:
      tags: [Item]
      operationId: createItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Item" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
  /items/{id}:
    get:
      tags: [Item]
      operationId: getItem
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "404": { description: Not Found }
    put:
      tags: [Item]
      operationId: updateItem
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Item" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "404": { description: Not Found }
    delete:
      tags: [Item]
      operationId: deleteItem
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: No Content }
        "404": { description: Not Found }
components:
  schemas:
    Item:
      type: object
      properties:
        id: { type: integer, format: int64, readOnly: true }
        name: { type: string }
        description: { type: string }
      required: [name]
    Order:
      type: object
      properties:
        id: { type: string, readOnly: true }
        userId: { type: integer, format: int64 }
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
      required: [userId, items]
    OrderItem:
      type: object
      properties:
        productId: { type: integer, format: int64 }
        quantity: { type: integer, format: int32 }
      required: [productId, quantity]
    Invoice:
      type: object
      properties:
        orderId: { type: string }
        subTotal: { type: number, format: double }
        shipping: { type: number, format: double }
        grandTotal: { type: number, format: double }
        status: { type: string, enum: ["SUCCESS", "FAIL"] }
